name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the main branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      content_sha:
        description: "Optional commit SHA from luke-cheng/luke-cheng to build against"
        required: false

  # Sent by luke-cheng/luke-cheng after its Markdown content changes.
  repository_dispatch:
    types:
      - content-updated

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout published content
        uses: actions/checkout@v7
        with:
          repository: luke-cheng/luke-cheng
          # A workflow_dispatch or repository_dispatch build can target an exact content commit.
          # Manual/site-code builds use the current main branch instead.
          ref: ${{ github.event.inputs.content_sha || github.event.client_payload.content_sha || github.event.client_payload.sha || 'main' }}
          path: content-source
          persist-credentials: false
          # Only fetch the Markdown used by the static build.
          sparse-checkout: |
            LukeCheng.md
            blogs/**
          sparse-checkout-cone-mode: false

      - name: Publish the portfolio source for the browser AI
        run: |
          test -f content-source/LukeCheng.md
          test -d content-source/blogs
          cp content-source/LukeCheng.md public/portfolio.md

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v6

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build with Next.js
        run: CONTENT_DIR=content-source npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
